name: iOS & watchOS Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build WODwire Apple Apps
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate



      # NOTE: To produce an actual .ipa file that can be installed on a device, 
      # you will need to add steps here to install your Apple Developer certificates 
      # and provisioning profiles. For now, this step just verifies that the code 
      # compiles successfully on a Mac.

      - name: Build iOS App (Simulator Architecture)
        run: |
          xcodebuild clean build \
            -project WODwire.xcodeproj \
            -scheme WODwire \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build watchOS App (Simulator Architecture) 
        run: |
          xcodebuild build \
            -project WODwire.xcodeproj \
            -scheme WODwireWatch \
            -destination "generic/platform=watchOS Simulator" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
