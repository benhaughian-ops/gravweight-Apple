name: iOS & watchOS Build & Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build WODwire Apple Apps
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Apple Certificate and Provisioning Profiles
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          WATCH_PROVISION_PROFILE_BASE64: ${{ secrets.WATCH_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          WATCH_PP_PATH=$RUNNER_TEMP/watch_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profiles from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          echo -n "$WATCH_PROVISION_PROFILE_BASE64" | base64 --decode -o $WATCH_PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          
          # extract UUIDs from profiles and rename them so xcodebuild finds them automatically
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i $PP_PATH))
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          
          WATCH_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i $WATCH_PP_PATH))
          cp $WATCH_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$WATCH_UUID.mobileprovision

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Create ExportOptions.plist
        run: |
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i $RUNNER_TEMP/build_pp.mobileprovision))
          WATCH_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i $RUNNER_TEMP/watch_pp.mobileprovision))
          cat <<EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>Q7X72CDFC4</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.WODwire</key>
                  <string>$UUID</string>
                  <key>com.WODwire.watchkitapp</key>
                  <string>$WATCH_UUID</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Archive WODwire App
        run: |
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i $RUNNER_TEMP/build_pp.mobileprovision))
          WATCH_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i $RUNNER_TEMP/watch_pp.mobileprovision))
          
          xcodebuild archive \
            -project WODwire.xcodeproj \
            -scheme WODwire \
            -archivePath $RUNNER_TEMP/WODwire.xcarchive \
            -destination "generic/platform=iOS" \
            APP_PROFILE=$UUID \
            WATCH_PROFILE=$WATCH_UUID

      - name: Export .ipa file
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/WODwire.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist exportOptions.plist

      - name: Upload .ipa as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WODwire-App
          path: ${{ runner.temp }}/export/*.ipa

      - name: Upload to App Store Connect / TestFlight
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          # Find the generated .ipa file
          IPA_PATH=$(ls $RUNNER_TEMP/export/*.ipa | head -n 1)
          
          # Create a fastlane directory to avoid interactive prompts
          mkdir -p fastlane
          
          # Create a Fastfile inside it to handle the API keys properly
          cat <<EOF > fastlane/Fastfile
          lane :release_testflight do
            app_store_connect_api_key(
              key_id: ENV["APPSTORE_KEY_ID"],
              issuer_id: ENV["APPSTORE_ISSUER_ID"],
              key_content: ENV["APPSTORE_PRIVATE_KEY"],
              is_key_content_base64: false
            )
            
            upload_to_testflight(
              ipa: "$IPA_PATH",
              skip_waiting_for_build_processing: true
            )
          end
          EOF
          
          # Run the inline Fastfile
          fastlane release_testflight
