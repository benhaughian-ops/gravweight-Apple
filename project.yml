# XcodeGen spec — generates WODwire.xcodeproj on your Mac.
#   brew install xcodegen
#   cd apple && xcodegen generate
name: WODwire

options:
  bundleIdPrefix: com.gravweight
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: "Q7X72CDFC4"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: "1.0.0"

targets:
  # ───────────────────────── iPhone app ─────────────────────────
  WODwire:
    type: application
    platform: iOS
    sources:
      - path: WODwire
      - path: Shared
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      - target: WODwireWatch       # embeds the watch app ("Embed Watch Content")
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.WODwire
        PRODUCT_NAME: WODwire
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE)
        CODE_SIGN_IDENTITY: "Apple Distribution"
    info:
      path: WODwire/Info.plist
      properties:
        CFBundleDisplayName: WODwire
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        NSHealthShareUsageDescription: "WODwire reads your steps, heart rate, calories, workouts and body measurements to show them on your dashboard and sync them to the WODwire web app."
        NSHealthUpdateUsageDescription: "WODwire may save workout data to Apple Health."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: WODwire/WODwire.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.associated-domains:
          - webcredentials:aware-mayfly-5498.clerk.accounts.dev

  # ───────────────────────── Apple Watch app ─────────────────────────
  WODwireWatch:
    type: application
    platform: watchOS
    sources:
      - path: WODwireWatch
      - path: Shared
    dependencies:
      - sdk: WatchConnectivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.WODwire.watchkitapp
        PRODUCT_NAME: WODwireWatch
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PROVISIONING_PROFILE_SPECIFIER: $(WATCH_PROFILE)
        CODE_SIGN_IDENTITY: "Apple Distribution"
    info:
      path: WODwireWatch/Info.plist
      properties:
        CFBundleDisplayName: WODwire
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.WODwire

schemes:
  WODwire:
    build:
      targets:
        WODwire: all
        WODwireWatch: all
    run:
      config: Debug
  WODwireWatch:
    build:
      targets:
        WODwireWatch: all
    run:
      config: Debug
